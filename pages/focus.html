<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foco | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../js/mood-states.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/focus.js" defer></script>
  </head>
  <body data-page="focus" data-screen="focus">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page focus-page" id="focusPage">
        <header class="page-header">
          <h1 id="focusTitle">Foco: energia média</h1>
          <p id="focusSubtitle">Sugerido pelo check-in e pelo planejamento do dia.</p>
          <div class="chip-row focus-top-chips" id="focusTopChips"></div>
        </header>

        <section class="stack-lg">
          <section class="focus-timer-cluster">
            <div class="timer">
              <img id="timerRing" src="../assets/images/focus-ring-neutral.svg" alt="" aria-hidden="true">
              <strong id="timerDisplay" aria-hidden="true">25:00</strong>
              <span id="timerModeLabel">Foco leve</span>
            </div>
            <div class="focus-controls">
              <button class="focus-control secondary" id="pauseFocus" type="button" aria-label="Voltar">
                <span class="focus-control-glyph" aria-hidden="true">←</span>
                <span class="focus-control-label">Voltar</span>
              </button>
              <button class="focus-control primary" id="startFocus" type="button" aria-label="Iniciar sessão de foco">
                <span class="focus-control-glyph" aria-hidden="true">▶</span>
                <span class="focus-control-label">Iniciar</span>
              </button>
              <button class="focus-control secondary" id="finishFocus" type="button" aria-label="Deixar para depois">
                <span class="focus-control-glyph" aria-hidden="true">⏭</span>
                <span class="focus-control-label">Depois</span>
              </button>
            </div>
          </section>

          <section class="focus-presets">
            <h2 id="focusPresetTitle">Escolher sessão ideal</h2>
            <div class="preset-row">
              <p class="card-loading-hint" aria-hidden="true">Carregando sessões…</p>
            </div>
          </section>

          <section class="focus-task-card">
            <h2 id="focusTaskSectionTitle">Tarefa recomendada</h2>
            <div class="focus-task-summary">
              <h3 id="focusTaskTitle">Revisar relatório com calma</h3>
              <p id="suggestedTaskText">Média prioridade · esforço médio · 1 sessão</p>
            </div>
            <div class="chip-row focus-task-chips" id="focusTaskChips"></div>
            <label class="field focus-task-switcher">
              <span>Tarefa do foco</span>
              <select id="focusTaskSelect">
                <option value="" disabled selected>Carregando tarefas…</option>
              </select>
            </label>
            <button class="button secondary full" id="useSuggestedTask" type="button">Usar tarefa sugerida</button>
          </section>

          <section class="focus-context-card" id="focusContextCard"></section>
        </section>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hábitos | Plenna</title>
    <link rel="stylesheet" href="../style.css?v=20260430-figma">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js?v=20260429-icons" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js?v=20260430-figma" defer></script>
    <script src="../js/habits.js" defer></script>
  </head>
  <body data-page="habits" data-screen="habits">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page habits-page">
        <header class="page-header">
          <h1>Cuidados pequenos</h1>
          <p>Crie hábitos flexíveis e marque o mínimo feito hoje.</p>
          <div class="row between habit-today">
            <strong id="habitTodayTitle">Hoje</strong>
            <span id="habitProgressText">0 de 0 concluídos</span>
          </div>
          <div class="habit-progress"><span id="habitProgressFill"></span></div>
        </header>

        <section class="stack-lg">
          <details class="habit-create">
            <summary>+ Novo</summary>
            <form class="card form" id="habitForm">
              <label class="field">
                <span>Nome</span>
                <input name="nome" required placeholder="Ex.: Beber água">
              </label>
              <div class="grid-2">
                <label class="field">
                  <span>Categoria</span>
                  <select name="categoria" id="habitCategorySelect"></select>
                </label>
                <label class="field">
                  <span>Frequência</span>
                  <select name="frequencia" id="habitFrequencySelect"></select>
                </label>
              </div>
              <label class="field">
                <span>Meta mínima</span>
                <input name="metaMinima" placeholder="Ex.: 1 copo, 5 minutos">
              </label>
              <button class="button primary full" type="submit">Criar hábito</button>
            </form>
          </details>

          <div class="content-list" id="habitList"></div>

          <section class="shortcut-grid compact-shortcuts" aria-label="Apoios para hábitos">
            <a class="shortcut" href="habit-templates.html"><svg class="plenna-icon shortcut-icon"><use href="../assets/icons/plenna-icons.svg?v=20260429-icons#icon-heart"></use></svg>Templates</a>
            <a class="shortcut" href="micro-pauses.html"><svg class="plenna-icon shortcut-icon"><use href="../assets/icons/plenna-icons.svg?v=20260429-icons#icon-focus"></use></svg>Micro pausas</a>
          </section>

          <section class="habit-insight">
            <h2>Insight do hábito</h2>
            <p>Você mantém mais hábitos quando começa o dia com hidratação e check-in cedo.</p>
          </section>
        </section>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

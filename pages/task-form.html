<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefa | Plenna</title>
    <link rel="stylesheet" href="../style.css?v=20260520-button-audit">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js?v=20260429-icons" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js?v=20260430-figma" defer></script>
    <script src="../js/task-form.js" defer></script>
  </head>
  <body data-page="tasks" data-screen="task-form">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page task-form-page">
        <header class="page-header task-form-header">
          <h1 id="formTitle">Nova tarefa</h1>
        </header>

        <form class="form" id="taskForm">
          <section class="card task-title-card">
            <label class="field">
              <span>Título</span>
              <input name="titulo" required maxlength="90" placeholder="Ex.: Revisar apresentação">
            </label>
            <label class="field">
              <span>Descrição</span>
              <textarea name="descricao" placeholder="Contexto, próximos passos ou observações"></textarea>
            </label>
          </section>

          <section class="card task-fields-card">
            <h3>Campos da tarefa</h3>
            <div class="grid-2">
              <label class="field">
                <span>Prioridade</span>
                <select name="prioridade" id="prioritySelect"></select>
              </label>
              <label class="field">
                <span>Esforço</span>
                <select name="esforco" id="effortSelect"></select>
              </label>
            </div>
            <div class="grid-2">
              <label class="field">
                <span>Tempo estimado</span>
                <input name="tempoEstimado" placeholder="25 min">
              </label>
              <label class="field">
                <span>Impacto emocional</span>
                <select name="impactoEmocional" id="impactSelect"></select>
              </label>
            </div>
            <div class="grid-2">
              <label class="field">
                <span>Prazo</span>
                <input name="prazo" type="date" aria-label="Prazo da tarefa">
              </label>
              <label class="field">
                <span>Projeto/categoria</span>
                <input name="categoria" placeholder="Trabalho, casa...">
              </label>
            </div>
          </section>

          <button class="button primary full" type="submit">Adicionar tarefa</button>
          <a class="button secondary full" href="tasks.html">Cancelar</a>
        </form>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

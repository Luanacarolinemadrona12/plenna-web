<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lembretes | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/dedicated-pages.js" defer></script>
  </head>
  <body data-page="more" data-screen="reminders">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page reminders-figma-page">
        <header class="proto-topbar reminders-figma-header">
          <h1>Lembretes</h1>
        </header>

        <section class="reminder-summary-card">
          <h2>Resumo de hoje</h2>
          <div class="reminder-chip-row">
            <span class="chip" data-reminder-total>4 apoios ativos</span>
            <span class="chip" data-reminder-quiet-chip hidden>silencioso à noite</span>
            <span class="chip" data-reminder-light-chip hidden>mais leve quando precisa</span>
          </div>
        </section>

        <section class="reminder-card-list" id="reminderList">
          <p class="card-loading-hint" aria-hidden="true">Carregando lembretes…</p>
        </section>

        <section class="reminder-connected-card">
          <div class="reminder-action-row">
            <a class="button secondary small" href="settings.html">Ajustar ritmo</a>
            <a class="button secondary small" href="micro-pauses.html">Ver pausas</a>
          </div>
        </section>

        <details class="reminder-create-shell" data-reminder-create-shell>
          <summary>Criar um apoio leve</summary>
          <form class="reminder-create-form reminder-create-panel" data-dedicated-reminder-form>
            <label class="field compact-field">
              <span>Nome do apoio</span>
              <input name="title" required placeholder="Novo apoio">
            </label>
            <label class="field compact-field">
              <span>Mensagem</span>
              <input name="body" required placeholder="Mensagem acolhedora">
            </label>
            <div class="grid-2">
              <label class="field compact-field">
                <span>Horário</span>
                <input name="time" type="time" value="09:00">
              </label>
              <label class="field compact-field">
                <span>Status</span>
                <select name="active">
                  <option value="true">Ativo</option>
                  <option value="false">Pausado</option>
                </select>
              </label>
            </div>
            <button class="button primary full" type="submit">Salvar apoio</button>
            <button class="button secondary full" type="button" data-close-details>Fechar criação</button>
          </form>
        </details>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

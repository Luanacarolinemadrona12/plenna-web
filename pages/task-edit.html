<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar tarefa | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/task-form.js" defer></script>
  </head>
  <body data-page="tasks" data-screen="task-edit">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page task-form-page figma-task-form-page">
        <header class="task-form-title-only">
          <h1 id="formTitle">Editar tarefa</h1>
        </header>

        <form class="form figma-task-form" id="taskForm" data-skip-example="true">
          <section class="card task-title-card figma-task-title-card">
            <label class="field">
              <span>Título</span>
              <input name="titulo" required maxlength="90" value="Preparar apresentação Q2">
            </label>
            <label class="field">
              <span>Descrição</span>
              <textarea name="descricao">Revisar narrativa, métricas e próximos passos.</textarea>
            </label>
          </section>

          <section class="card task-fields-card figma-task-fields-card">
            <div class="figma-field-row">
              <span>Prioridade</span>
              <label class="choice-chip strong"><input type="radio" name="prioridade" value="alta" checked>Alta</label>
              <label class="choice-chip muted"><input type="radio" name="prioridade" value="media">Média</label>
              <label class="choice-chip muted"><input type="radio" name="prioridade" value="baixa">Baixa</label>
              <label class="choice-chip muted"><input type="radio" name="prioridade" value="nenhuma">Nenhuma</label>
            </div>
            <div class="figma-field-grid">
              <label class="figma-pill-input"><span>Tempo</span><input name="tempoEstimado" value="--:--"></label>
              <label class="figma-pill-input"><span>Prazo</span><input name="prazo" type="date" aria-label="Prazo da tarefa"></label>
            </div>
            <details class="task-advanced-toggle">
              <summary>Mais detalhes</summary>
              <div class="figma-field-grid">
                <label class="figma-pill-input yellow"><span>Esforço</span><select name="esforco"><option value="nenhum">Nenhum</option><option value="baixo">Baixo</option><option value="medio" selected>Médio</option><option value="alto">Alto</option></select></label>
                <label class="figma-pill-input mint"><span>Impacto emocional</span><select name="impactoEmocional"><option value="neutro">Neutro</option><option value="leve">Leve</option><option value="positivo">Positivo</option><option value="motivadora" selected>Motivadora</option><option value="pesado">Pesado</option></select></label>
                <label class="figma-pill-input"><span>Projeto</span><select name="projeto"><option>Trabalho</option><option>Pessoal</option><option>Saúde</option><option>Nenhum</option></select></label>
                <label class="figma-pill-input"><span>Categoria</span><select name="categoria"><option>Cliente ABC</option><option>Rotina</option><option>Casa</option><option>Nenhuma</option></select></label>
              </div>
            </details>
          </section>

          <section class="card figma-subtasks-card">
            <div class="figma-card-head">
              <h3>Subtarefas</h3>
              <span class="chip">2 de 5 concluídas</span>
            </div>
            <ol class="figma-subtask-list edit">
              <li><b>✓</b><span>Revisar roteiro</span><i>≡</i></li>
              <li><b>✓</b><span>Separar imagens</span><i>≡</i></li>
              <li><b>!</b><span>Ajustar gráficos</span><i>≡</i></li>
            </ol>
            <textarea class="visually-hidden" name="subtarefas" aria-label="Subtarefas">Revisar roteiro
Separar imagens
Ajustar gráficos</textarea>
          </section>

          <section class="card figma-task-meta-card">
            <h3>Repetição e lembretes</h3>
            <div class="figma-field-grid">
              <label class="figma-pill-input mint"><span>Recorrência</span><select id="recurrenceSelect" name="recorrencia"></select></label>
              <label class="figma-pill-input yellow"><span>Lembrete</span><select id="reminderSelect" name="lembrete"></select></label>
            </div>
          </section>

          <section class="card figma-task-submit-card">
            <button class="button primary full" type="submit">Salvar alterações</button>
            <a class="button secondary full" href="tasks.html">Cancelar</a>
            <button class="button danger full" type="button" id="deleteTask">Excluir tarefa</button>
          </section>
        </form>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

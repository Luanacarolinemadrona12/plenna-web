<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diário rápido | Plenna</title>
    <link rel="stylesheet" href="../style.css?v=20260520-button-audit">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js?v=20260429-icons" defer></script>
    <script src="../app.js?v=20260430-figma" defer></script>
    <script src="../js/dedicated-pages.js?v=20260519-journal-night-cards" defer></script>
  </head>
  <body data-page="more" data-screen="journal-night">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page dedicated-page dedicated-night figma-night-screen">
        <header class="proto-topbar night-emotional-top">
          <h1>Diário rápido</h1>
          <p>Feche o dia em 2 minutos e leve o essencial para a próxima semana.</p>
        </header>

        <form class="night-summary-flow night-card-form" data-night-form>
          <input type="hidden" name="tituloEdit" value="Diário rápido">
          <input type="hidden" name="tags" value="humor ok, aprendizado salvo, plano">

          <label class="figma-night-main-card night-quick-card">
            <span>15 de abril · quarta-feira</span>
            <strong>Mais estável ao fim do dia</strong>
            <textarea name="resumoEdit" required>Consegui fechar a apresentação, respeitei uma pausa e quero repetir isso amanhã.</textarea>
            <div class="chip-row" aria-label="Tags do registro">
              <span class="chip">humor ok</span>
              <span class="chip">aprendizado salvo</span>
            </div>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>Vitória de hoje</span>
            <textarea name="vitoriaEdit" required>Fechei a apresentação e mantive o treino curto.</textarea>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>O que me drenou</span>
            <textarea name="drenouEdit" required>Reuniões longas em sequência.</textarea>
          </label>

          <label class="night-prompt-card night-quick-field warm">
            <span>Aprendizado da semana</span>
            <textarea name="aprendizadoEdit" required>Pausas curtas me ajudam a fechar melhor o dia.</textarea>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>Plano de amanhã</span>
            <textarea name="planoEdit" required>Começar pelo relatório e proteger 1 pausa.</textarea>
          </label>

          <div class="night-submit-card">
            <button class="button primary full" type="submit">Salvar registro</button>
            <button class="button secondary full" type="submit" name="salvarAprendizado" value="true">Salvar aprendizado</button>
            <a class="button muted-action full" href="journal.html">Cancelar</a>
          </div>
        </form>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fechamento do dia | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/dedicated-pages.js" defer></script>
  </head>
  <body data-page="more" data-screen="journal-night">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page dedicated-page dedicated-night figma-night-screen">
        <header class="proto-topbar night-emotional-top">
          <h1>Fechamento do dia</h1>
        </header>

        <form class="night-summary-flow night-card-form" data-night-form>
          <input type="hidden" name="tituloEdit" value="Fechamento do dia">
          <input type="hidden" name="tags" value="">

          <label class="figma-night-main-card night-quick-card">
            <span id="journalNightDate">Hoje</span>
            <strong>Você chegou até aqui</strong>
            <textarea name="resumoEdit" required placeholder="Como foi o dia? Escreva o que quiser registrar…"></textarea>
            <div class="chip-row" aria-label="Tags do registro"></div>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>Vitória de hoje</span>
            <textarea name="vitoriaEdit" required placeholder="O que funcionou bem hoje?"></textarea>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>O que me drenou</span>
            <textarea name="drenouEdit" required placeholder="O que pesou mais hoje?"></textarea>
          </label>

          <label class="night-prompt-card night-quick-field">
            <span>Plano de amanhã</span>
            <textarea name="planoEdit" required placeholder="Com o que você quer começar amanhã?"></textarea>
          </label>

          <div class="night-submit-card">
            <button class="button primary full" type="submit">Salvar meu fechamento</button>
            <a class="button muted-action full" href="journal.html">Voltar ao diário</a>
          </div>
        </form>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diário e Notas | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/journal.js" defer></script>
  </head>
  <body data-page="more" data-screen="journal">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page journal-page">
        <header class="page-header">
          <h1>Diário</h1>
        </header>

        <section class="stack-lg">
          <section class="journal-banner">
            <div class="row">
              <a class="button secondary small" href="journal-night.html">Fechamento do dia</a>
              <a class="button secondary small" href="notes.html">Notas</a>
            </div>
          </section>

          <details class="journal-create">
            <summary>+ Criar registro</summary>
            <form class="card form" id="entryForm">
              <div class="segmented" role="tablist" aria-label="Tipo de registro">
                <button class="active" type="button" role="tab" data-entry-type="diario" aria-label="Criar entrada de diário" aria-selected="true">Diário</button>
                <button type="button" role="tab" data-entry-type="nota" aria-label="Criar nota rápida" aria-selected="false">Nota</button>
              </div>
              <input type="hidden" name="tipo" value="diario" id="entryType">
              <label class="field">
                <span>Título</span>
                <input name="titulo" required placeholder="Ex.: Fechamento do dia" aria-label="Título do registro">
              </label>
              <label class="field">
                <span>Conteúdo</span>
                <textarea name="conteudo" required placeholder="Escreva o que precisa ficar fora da cabeça." aria-label="Conteúdo do registro"></textarea>
              </label>
              <label class="field">
                <span>Tags</span>
                <input name="tags" placeholder="energia, trabalho, casa" aria-label="Tags do registro">
              </label>
              <button class="button primary full" type="submit" aria-label="Salvar registro">Salvar</button>
              <button class="button secondary full" type="reset" data-close-details aria-label="Cancelar registro">Cancelar</button>
            </form>
          </details>

          <section class="journal-list-wrap">
            <div class="row between">
              <h2>Registros</h2>
              <small id="entryCount">0 itens</small>
            </div>
            <div class="content-list" id="entryList">
              <p class="card-loading-hint" aria-hidden="true">Carregando registros…</p>
            </div>
            <p class="card-empty-hint" id="entryEmptyHint" hidden>Nenhum registro ainda. Use "+ Criar registro" para começar.</p>
          </section>
        </section>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

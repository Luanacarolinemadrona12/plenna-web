<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boas-vindas ao Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/screens.js" defer></script>
  </head>
  <body data-page="onboarding" data-screen="onboarding">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page" data-screen-root>
        <!-- fallback estático enquanto o JS carrega -->
        <div class="onboarding-v2">
          <div class="onboarding-hero">
            <span class="leaf-mark" aria-hidden="true">
              <img class="plenna-leaf" src="../assets/images/plenna-leaf.png" alt="">
            </span>
            <h1>Plenna</h1>
            <p>Um lugar calmo para escolher o essencial e seguir no seu ritmo.</p>
          </div>
          <div class="onboarding-cards">
            <div class="onboarding-feature">
              <span aria-hidden="true">✓</span>
              <strong>Escolha o que cabe no dia</strong>
            </div>
            <div class="onboarding-feature">
              <span aria-hidden="true">⏱</span>
              <strong>Proteja pausas entre blocos</strong>
            </div>
            <div class="onboarding-feature">
              <span aria-hidden="true">♡</span>
              <strong>Adapte a rotina ao seu momento</strong>
            </div>
          </div>
          <div class="onboarding-actions">
            <a class="button primary full onboarding-start" href="checkin.html">Começar check-in</a>
            <a class="button secondary full" href="home.html">Entrar no meu dia</a>
          </div>
        </div>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

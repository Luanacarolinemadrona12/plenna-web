<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefas | Plenna</title>
    <link rel="stylesheet" href="../style.css?v=20260521-cleanup">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js?v=20260521-cleanup" defer></script>
    <script src="../js/icons.js?v=20260429-icons" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js?v=20260430-figma" defer></script>
    <script src="../js/tasks.js?v=20260521-full-review" defer></script>
  </head>
  <body data-page="tasks" data-screen="tasks">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page tasks-page">
        <header class="page-header">
          <div>
            <h1>Tarefas</h1>
            <p>Organize por energia, esforço, prazo e contexto.</p>
          </div>
        </header>

        <section class="stack">
          <nav class="task-view-tabs" aria-label="Visualização de tarefas">
            <a class="active" aria-current="page" href="tasks.html">Lista</a>
            <a href="calendar-week.html">Semana</a>
            <a href="calendar-month.html">Mês</a>
          </nav>

          <div class="quick-add">
            <label class="sr-only" for="taskSearch">Adicionar rápido ou buscar tarefa</label>
            <input id="taskSearch" type="search" placeholder="Adicionar rápido ou buscar tarefa..." aria-label="Adicionar rápido ou buscar tarefa">
            <a class="button primary small" href="task-new.html">+ Nova</a>
          </div>

          <div class="task-tabs" id="taskTabs"></div>

          <div class="filter-card">
            <strong>Filtros salvos</strong>
            <div id="savedTaskFilters">
              <button type="button" data-filter="alta">Prioridade</button>
              <button type="button" data-filter="com-prazo">Prazo</button>
              <button type="button" data-filter="projeto">Projetos</button>
            </div>
          </div>

          <div class="row between task-section-heading">
            <strong>Hoje · Recomendadas pelo check-in</strong>
            <a href="planning.html">Redistribuir</a>
          </div>

          <div class="content-list" id="taskList"></div>
        </section>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

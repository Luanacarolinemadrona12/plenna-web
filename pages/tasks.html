<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="../plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarefas | Plenna</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/data.js" defer></script>
    <script src="../app.js" defer></script>
    <script src="../js/tasks.js" defer></script>
  </head>
  <body data-page="tasks" data-screen="tasks">
    <div class="app-shell">
      <div class="status-bar"><span data-status-time>9:41</span><span class="status-glyphs" aria-hidden="true"><i class="dot"></i><i class="signal"></i><i class="battery"></i></span></div>
      <main class="page tasks-page">
        <header class="page-header">
          <div>
            <h1>Tarefas</h1>
          </div>
        </header>

        <section class="stack">
          <nav class="task-view-tabs" aria-label="Visualização de tarefas">
            <a class="active" aria-current="page" href="tasks.html">Lista</a>
            <a href="calendar-week.html">Semana</a>
            <a href="calendar-month.html">Mês</a>
          </nav>

          <div class="quick-add">
            <label class="sr-only" for="taskSearch">Adicionar rápido ou buscar tarefa</label>
            <input id="taskSearch" type="search" placeholder="Adicionar rápido ou buscar tarefa..." aria-label="Adicionar rápido ou buscar tarefa">
            <a class="button primary small" href="task-new.html">+ Nova</a>
          </div>

          <div class="task-tabs" id="taskTabs" role="group" aria-label="Filtrar tarefas por status">
            <button class="task-tab active" type="button" data-filter="caixa" aria-pressed="true">Caixa <strong>0</strong></button>
            <button class="task-tab" type="button" data-filter="hoje" aria-pressed="false">Hoje <strong>0</strong></button>
            <button class="task-tab" type="button" data-filter="proximas" aria-pressed="false">Próx. <strong>0</strong></button>
            <button class="task-tab" type="button" data-filter="concluidas" aria-pressed="false">Concl. <strong>0</strong></button>
          </div>

          <div class="filter-card">
            <h2>Filtros salvos</h2>
            <div id="savedTaskFilters">
              <button type="button" data-filter="alta" aria-pressed="false">Prioridade</button>
              <button type="button" data-filter="com-prazo" aria-pressed="false">Prazo</button>
              <button type="button" data-filter="projeto" aria-pressed="false">Projetos</button>
            </div>
          </div>

          <div class="row between task-section-heading">
            <h2>Hoje</h2>
            <a href="planning.html">Redistribuir</a>
          </div>

          <div class="content-list" id="taskList">
            <p class="card-loading-hint" aria-hidden="true">Carregando tarefas…</p>
          </div>
        </section>
      </main>
      <div data-bottom-nav></div>
    </div>
  </body>
</html>

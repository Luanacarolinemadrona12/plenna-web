<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#e8eef4}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="app" src="http://127.0.0.1:8849/pages/checkin.html"></iframe>
<script>
const frame = document.getElementById('app');
frame.addEventListener('load', function(){
  setTimeout(function(){
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const btn = doc.querySelector('#skipCheckin');
      if (btn) btn.click();
    } catch (error) { console.error(error); }
  }, 1000);
});
</script>

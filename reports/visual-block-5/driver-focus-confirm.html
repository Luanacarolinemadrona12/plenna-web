<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#e8eef4}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="app" src="http://127.0.0.1:8849/pages/focus-session.html"></iframe>
<script>
const frame = document.getElementById('app');
frame.addEventListener('load', function(){
  setTimeout(function(){
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const start = doc.querySelector('#sessionStart');
      if (start) start.click();
      setTimeout(function(){
        const finish = doc.querySelector('#sessionFinish');
        if (finish) finish.click();
      }, 1500);
    } catch (error) { console.error(error); }
  }, 1000);
});
</script>

<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" href="plenna-leaf.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plenna</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/icons.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="index">
    <div class="app-shell onboarding-app">
      <main class="onboarding-v2">

        <section class="onboarding-hero">
          <div class="leaf-mark" aria-hidden="true">
            <img src="assets/images/plenna-leaf.png" alt="">
          </div>
          <h1>Plenna</h1>
          <p>Seu dia com intenção e equilíbrio.</p>
        </section>

        <section class="onboarding-cards" aria-label="Recursos principais">
          <article class="onboarding-feature">
            <span>
              <svg class="plenna-icon" aria-hidden="true"><use href="assets/icons/plenna-icons.svg#icon-check"></use></svg>
            </span>
            <strong>Tarefas e hábitos em ordem</strong>
          </article>
          <article class="onboarding-feature">
            <span>
              <svg class="plenna-icon" aria-hidden="true"><use href="assets/icons/plenna-icons.svg#icon-focus"></use></svg>
            </span>
            <strong>Modo foco com pausa protegida</strong>
          </article>
          <article class="onboarding-feature">
            <span>
              <svg class="plenna-icon" aria-hidden="true"><use href="assets/icons/plenna-icons.svg#icon-heart"></use></svg>
            </span>
            <strong>Check-in emocional diário</strong>
          </article>
        </section>

        <section class="onboarding-actions">
          <a class="button primary onboarding-start" href="pages/checkin.html">Começar check-in</a>
          <a class="onboarding-login" href="pages/home.html">Entrar no meu dia</a>
        </section>

      </main>
    </div>
  </body>
</html>
